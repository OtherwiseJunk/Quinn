server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — immutable hashed filenames, cache aggressively, never fallback to index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html should never be cached — it contains references to hashed assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Route all other requests to index.html for Vue Router to handle
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the server container
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
